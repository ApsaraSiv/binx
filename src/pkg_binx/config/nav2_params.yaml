bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_footprint
      odom_topic: /odom
      default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_only_if_path_becomes_invalid.xml"
      default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_only_if_path_becomes_invalid.xml"

amcl:
    ros__parameters:
      use_sim_time: True
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: base_footprint
      global_frame_id: map
      odom_frame_id: odom
      scan_topic: scan
      robot_model_type: "nav2_amcl::OmniMotionModel"
      max_particles: 2000
      min_particles: 500
      laser_max_range: 12.0
      laser_min_range: 0.1
      laser_max_beams: 180
      update_min_d: 0.1
      update_min_a: 0.1
      publish_particle_cloud: true
      transform_tolerance: 0.5
      set_initial_pose: True
      initial_pose:
        x: 0.0
        y: 0.0
        z: 0.0
        yaw: 0.0

map_server:
    ros__parameters:
      use_sim_time: True
      yaml_filename: "maze_map.yaml"

planner_server:
    ros__parameters:
      use_sim_time: True
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 1.0
        use_astar: True
        allow_unknown: True

controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      progress_checker_plugin: "progress_checker"
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.3
        movement_time_allowance: 30.0
      goal_checker_plugins: ["goal_checker"]
      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.5
        yaw_goal_tolerance: 0.5
      controller_plugins: ["FollowPath"]
      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: 0.35
        lookahead_dist: 0.5
        min_lookahead_dist: 0.3
        max_lookahead_dist: 1.0
        lookahead_time: 1.5
        transform_tolerance: 0.5
        use_velocity_scaled_lookahead_dist: true
        min_approach_linear_velocity: 0.05
        approach_velocity_scaling_dist: 0.8
        use_regulated_linear_velocity_scaling: true
        use_cost_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_radius: 0.5
        regulated_linear_scaling_min_speed: 0.15
        use_rotate_to_heading: false
        allow_reversing: false
        max_robot_pose_search_dist: 10.0
        use_collision_detection: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 5.0
      footprint: "[[-0.5, -0.375], [0.5, -0.375], [0.5, 0.375], [-0.5, 0.375]]"
      footprint_padding: 0.15
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.4

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: True
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.5, -0.375], [0.5, -0.375], [0.5, 0.375], [-0.5, 0.375]]"
      footprint_padding: 0.15
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.4
